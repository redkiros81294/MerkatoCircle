# Test-specific configuration

# --- H2 (in-memory, ONE DATABASE PER SPRING CONTEXT) ---
# A single JVM (one `mvn test` run) builds several different Spring contexts: the
# Selenium context (RANDOM_PORT), the MockMvc contexts, the plain @SpringBootTest
# context. Spring caches those contexts and does NOT close them between test classes.
#
# With a shared database name ("jdbc:h2:mem:testdb"), every context that starts up
# runs Hibernate's create-drop against THE SAME database - dropping and recreating
# the tables an already-cached context is still pointing at. Several MockMvc tests
# also @MockBean the CommandLineRunner, so those contexts recreate the schema without
# reseeding it. Any cached context reused after that point sees an empty or
# half-seeded database: exactly the kind of order-dependent, "only fails in CI"
# breakage that is hard to reproduce locally.
#
# ${random.uuid} is resolved once per context refresh, so each context gets its own
# private database and cannot disturb any other.
spring.datasource.url=jdbc:h2:mem:iqub-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Disable open-in-view for tests ---
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Chapa ---
chapa.secret-key=test-key-not-used