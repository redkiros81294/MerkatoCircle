# Test-specific configuration
# Use in-memory H2 database for tests to avoid constraint violations

# --- H2 (in-memory for tests) ---
# DB_CLOSE_DELAY=-1 keeps the DB alive across the Spring context lifecycle so the
# Selenium tests (which spin up a real server on a random port) can still read the
# seeded data. The unique name per JVM invocation prevents any state leaking between
# test classes that happen to share a single Maven invocation.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Disable open-in-view for tests ---
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Chapa ---
chapa.secret-key=test-key-not-used
