<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage members — Merkato Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="authed">
<div th:replace="~{layout :: topbar(active='groups')}"></div>
<main>
  <div th:replace="~{layout :: messages}"></div>
  <a th:href="@{/groups}" class="btn btn-ghost" style="margin-bottom:16px;">&larr; All groups</a>
  <h2 style="margin-bottom:2px;" th:text="|${iqub.name} — members|"></h2>
  <p style="margin-bottom:18px;">You're the organizer, so you can see the waitlist and remove members here.</p>

  <div class="card card--tight">
    <table>
      <thead><tr><th>Member</th><th>Status</th><th>Joined</th><th>This cycle</th><th></th></tr></thead>
      <tbody>
        <tr th:each="m : ${memberships}">
          <td th:text="${m.member.fullName}"></td>
          <td>
            <span class="badge badge--active" th:if="${m.status.name() == 'ACTIVE'}">Active</span>
            <span class="badge badge--pending" th:if="${m.status.name() == 'WAITLISTED'}">Waitlisted</span>
            <span class="badge badge--defaulted" th:if="${m.status.name() == 'DEFAULTED'}">Defaulted</span>
          </td>
          <td th:text="${#temporals.format(m.joinedDate, 'd MMM yyyy')}"></td>
          <td th:text="${m.hasReceivedPayoutThisCycle} ? 'Already had a turn' : 'Waiting'"></td>
          <td>
            <form th:action="@{/groups/{id}/members/{mid}/remove(id=${iqub.id},mid=${m.id})}" method="post"
                  onsubmit="return confirm('Remove this member from the group?');">
              <button type="submit" class="btn btn-ghost btn-sm">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="help" style="margin-top:12px;">Removing an ACTIVE member frees a seat — the longest-waiting person on the waitlist is promoted automatically and notified.</p>
</main>
</body>
</html>
