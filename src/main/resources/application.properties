spring.application.name=iqub

server.port=8080

# --- H2 (file-based for persistence) ---
spring.datasource.url=jdbc:h2:file:./data/iqub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Cache off in development so template edits show up without a restart.
spring.thymeleaf.cache=false

# --- Chapa ---
# Only ever read by ChapaPaymentGateway, which only exists under the "chapa" profile
# (see PaymentGateway / FakePaymentGateway). Real value belongs in an environment
# variable, never committed — see application-chapa.properties and the README.
chapa.secret-key=${CHAPA_SECRET_KEY:not-set}
