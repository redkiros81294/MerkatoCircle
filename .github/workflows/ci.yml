name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Chrome for Selenium
        run: |
          sudo apt-get update
          # Install chromium AND its version-matched driver from the same apt repo.
          # NOTE: on Ubuntu 22.04+/24.04 (ubuntu-latest), "chromium-browser" and
          # "chromium-chromedriver" are empty transitional packages that just wrap
          # the Snap Store build of Chromium. There is no working snapd on GitHub
          # Actions runners, so those packages install but produce a stub binary
          # that refuses to run ("requires the chromium snap to be installed").
          # The real, non-snap packages on this Ubuntu release are "chromium" and
          # "chromium-driver". SeleniumManager's own auto-download can otherwise
          # silently fetch a ChromeDriver whose CDP version does not match the
          # installed Chromium, which made the fake-checkout Selenium tests time
          # out waiting for navigation the driver never reported. Bundling both
          # from one source keeps the pair in sync.
          sudo apt-get install -y chromium chromium-driver

      - name: Create data directory
        run: mkdir -p data

      - name: Run unit and integration tests
        run: mvn clean test
        env:
          # Point Selenium at the apt-installed, version-matched binaries.
          # (The "chromium-driver" package installs the driver as "chromiumdriver".)
          CHROME_BIN: /usr/bin/chromium
          CHROMEDRIVER_BIN: /usr/bin/chromiumdriver

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
