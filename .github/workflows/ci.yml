name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Chrome and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Report browser versions
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Run unit and integration tests
        run: mvn -B -ntp clean test
        env:
          # setup-chrome downloads Chrome and ChromeDriver from Google's
          # "Chrome for Testing" infra as a matched pair, so there's no
          # version-mismatch risk and no apt package-naming guesswork
          # (Ubuntu no longer ships real, non-snap chromium/chromedriver
          # apt packages, which is what broke this step previously).
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - name: Upload Selenium diagnostics (screenshots + page dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-diagnostics
          path: target/selenium-diagnostics/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/